<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої посилання</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            margin: 15px 0;
            padding: 15px;
            background: #0077ff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0055cc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Корисні посилання</h1>

    <a class="btn" href="https://t.me/KoudijsContactBot" target="_blank">
        Телефонний довідник Коудайс Україна
    </a>

</div>

</body>
</html>
